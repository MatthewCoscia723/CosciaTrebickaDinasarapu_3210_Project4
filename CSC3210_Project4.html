<html>
<head>
    <title>CSC3210 War Wagers</title>
    <style> 
    body {margin: 0; overflow: hidden}
    </style>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// Initializes the Scene
const scene = new THREE.Scene();

// Configures the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 9, 15); // Raises and pulls back the camera to look down at the table
camera.lookAt(new THREE.Vector3(0, 0, 0)); // Aims the camera at the center of the table
scene.add(camera);

// Temporary grid that marks the table area for positioning the camera (replaced by the table later)
const gridHelper = new THREE.GridHelper(12, 12);
scene.add(gridHelper);

// Initializes the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Function that resizes the renderer and camera when the window changes size
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix(); // Applies the new aspect ratio to the camera
    renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", onWindowResize);

// Function that runs once per frame to update and draw the scene
function animate() {
    requestAnimationFrame(animate); // Schedules the next frame
    renderer.render(scene, camera);
}

animate();
    </script>
</body>
</html>
