<html>
<head>
    <title>CSC3210 War Wagers</title>
    <style> 
    body {margin: 0; overflow: hidden}
    </style>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// Initializes the Scene
const scene = new THREE.Scene();

// Configures the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  35, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 9, 15); // Raises and pulls back the camera to look down at the table
camera.lookAt(new THREE.Vector3(0, 0, 0)); // Aims the camera at the center of the table
scene.add(camera);

// Loader that turns image files into textures
const textureLoader = new THREE.TextureLoader();

// Class that represents a single playing card with its value, suit, and 3D model
class Card {
    // IMPORTANT: Card dimensions
    static width = 1;
    static height = 1.45;
    static thickness = 0.02;

    // Texture shared by the back of every card
    static backTexture = textureLoader.load("assets/cards/back.png");

    constructor(value, suit) {
        this.value = value; // 2-14, where 11 = jack, 12 = queen, 13 = king, and 14 = ace
        this.suit = suit; // "clubs", "diamonds", "hearts", or "spades"
        this.frontTexture = textureLoader.load("assets/cards/" + this.getFileName());
        this.mesh = this.createMesh();
    }

    // Function that builds the image file name from the card's value and suit
    getFileName() {
        const faceNames = {
            11: "jack",
            12: "queen",
            13: "king",
            14: "ace"
        };
        const valueName = faceNames[this.value] || this.value; // Uses the plain number for 2-10
        return valueName + "_of_" + this.suit + ".png";
    }

    // Function that builds the thin box mesh with the front and back textures
    createMesh() {
        const geometry = new THREE.BoxGeometry(Card.width, Card.thickness, Card.height);
        const edgeShade = 0.6 + Math.random() * 0.4; // Random light grey so each card's edge stands out from its neighbors in the stack
        const edgeMaterial = new THREE.MeshStandardMaterial({
            color: new THREE.Color(edgeShade, edgeShade, edgeShade),
            emissive: 0x000000
        });

        // Array of materials for each side of the box, in the order +x, -x, +y, -y, +z, -z
        const materials = [
            edgeMaterial,
            edgeMaterial,
            new THREE.MeshStandardMaterial({
                map: this.frontTexture // Top side shows the front
            }),
            new THREE.MeshStandardMaterial({
                map: Card.backTexture // Bottom side shows the back
            }),
            edgeMaterial,
            edgeMaterial
        ];

        return new THREE.Mesh(geometry, materials);
    }
}

// Class that builds, shuffles, and deals a standard 52 card deck
class Deck {
    // Array of the 4 suit names, matching the image file names
    static suits = ["clubs", "diamonds", "hearts", "spades"];

    constructor() {
        this.cards = []; // Array that stores every card in the deck

        // Iterates over every suit and every value from 2 to 14 to build all 52 cards
        for (const suit of Deck.suits) {
            for (let value = 2; value <= 14; value++) {
                this.cards.push(new Card(value, suit));
            }
        }
    }

    // Function that shuffles the cards into a random order using the Fisher-Yates algorithm
    shuffle() {
        // Iterates backwards through the deck, swapping each card with a random card at or before it
        for (let i = this.cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1)); // Random index from 0 to i
            const temp = this.cards[i];
            this.cards[i] = this.cards[j];
            this.cards[j] = temp;
        }
    }

    // Function that deals the cards evenly to each player and returns an array of hands
    deal(numPlayers) {
        const cardsPerPlayer = Math.floor(this.cards.length / numPlayers); // 17 each for 3 players, leaving 1 card out
        const hands = []; // Array that stores each player's array of cards

        // Creates an empty hand for each player
        for (let p = 0; p < numPlayers; p++) {
            hands.push([]);
        }

        // Deals one card at a time around the table, like a real dealer
        for (let i = 0; i < cardsPerPlayer * numPlayers; i++) {
            hands[i % numPlayers].push(this.cards[i]);
        }

        return hands;
    }
}

// Class that represents a player and their face-down draw pile
class Player {
    constructor(name, cards, pilePosition) {
        this.name = name;
        this.cards = cards; // Array of the player's cards, where index 0 is the top of the pile
        this.pilePosition = pilePosition; // Spot on the table where the pile sits
        this.eliminated = false;

        // Adds every card in the player's hand to the scene
        for (const card of this.cards) {
            scene.add(card.mesh);
        }

        this.updatePile();
    }

    // Function that stacks the player's cards face down at their pile position
    updatePile() {
        // Iterates over every card, placing the top card (index 0) highest in the stack
        for (let i = 0; i < this.cards.length; i++) {
            const mesh = this.cards[i].mesh;
            const stackIndex = this.cards.length - 1 - i; // 0 for the bottom card, counting up to the top card
            mesh.position.set(
                this.pilePosition.x,
                stackIndex * Card.thickness + Card.thickness / 2, // Rests each card on the one below it
                this.pilePosition.z
            );
            mesh.rotation.set(0, 0, Math.PI); // Flips the card face down
        }
    }
}

// IMPORTANT: Width and depth of the square table top
const tableSize = 12;

// Texture for the wooden table top
const tableTexture = textureLoader.load("assets/table.jpg");

// Table top that all of the cards rest on
const table = new THREE.Mesh(
    new THREE.PlaneGeometry(tableSize, tableSize),
    new THREE.MeshStandardMaterial({map: tableTexture})
);
table.rotation.x = -Math.PI / 2; // Rotates the plane from standing upright to lying flat, facing up
scene.add(table);

// Temporary light so the cards are visible until the real lighting is added
scene.add(new THREE.AmbientLight(0xffffff, 1));

// Deck that is shuffled and dealt to 3 players
const deck = new Deck();
deck.shuffle();
const hands = deck.deal(3);

// IMPORTANT: Spots on the table for each player's pile
const pilePositions = [
    new THREE.Vector3(-4, 0, 3), // Player 1, front left
    new THREE.Vector3(0, 0, -4), // Player 2, back center
    new THREE.Vector3(4, 0, 3) // Player 3, front right
];

// Array that stores the 3 players
const players = [];

// Iterates over each hand, creating a player with their own pile position
for (let i = 0; i < hands.length; i++) {
    players.push(new Player("Player " + (i + 1), hands[i], pilePositions[i]));
}

let playedCards = [];
let comparisonCards = [];
let cardsToMove = [];

let winner = 0;
let roundWaiting = false;
let movingCards = false;
let moveAmount = 0;
let collectingCards = false;
let winnerScale = 1;
let winnerTimer = 0;
let warRound = false;
let warStage = 0;
let gameOver = false;
let fastForward = false;

const clock = new THREE.Clock();

function drawCards() {
    playedCards = [];
    comparisonCards = [];
    cardsToMove = [];

    movingCards = true;
    winnerScale = 1;
    warRound = false;

    for (let i = 0; i < players.length; i++) {
        if (players[i].eliminated) {
            continue;
        }

        let card = players[i].cards.shift();

        if (card == undefined) {
            players[i].eliminated = true;
            continue;
        }

        card.playerIndex = i;
        card.faceDown = false;
        
        playedCards.push(card);
        comparisonCards.push(card);
        cardsToMove.push(card);

        card.startX = card.mesh.position.x;
        card.startY = card.mesh.position.y;
        card.startZ = card.mesh.position.z;

        card.endX = (i - 1) * 1.5;
        card.endY = 0.05;
        card.endZ = 0;
        
        card.mesh.rotation.set(Math.PI, 0, 0);

        players[i].updatePile();
    }
    moveAmount = 0;
}

function drawWarCards() {
    comparisonCards = [];
    cardsToMove = [];
    movingCards = true;

    for (let i = 0; i < players.length; i++) {
        if (players[i].eliminated) {
            continue;
        }
        
        if (warStage == 1 && players[i].cards.length < 2) {
            players[i].eliminated = true;
            console.log(players[i].name + " has been eliminated from war");

            while (players[i].cards.length > 0) {
                let card = players[i].cards.shift();

                card.playerIndex = i;
                card.faceDown = true;
                
                playedCards.push(card);
                cardsToMove.push(card);

                card.startX = card.mesh.position.x;
                card.startY = card.mesh.position.y;
                card.startZ = card.mesh.position.z;

                card.endX = (i - 1) * 1.5;
                card.endY = 0.09;
                card.endZ = 0;
                
                card.mesh.rotation.set(Math.PI, 0, 0);
            }

            players[i].updatePile();
            continue;
        }

        if (warStage == 1) {
            let downCard = players[i].cards.shift();
            
            downCard.playerIndex = i;
            downCard.faceDown = true;

            playedCards.push(downCard);
            cardsToMove.push(downCard);

            downCard.startX = downCard.mesh.position.x;
            downCard.startY = downCard.mesh.position.y;
            downCard.startZ = downCard.mesh.position.z;

            downCard.endX = (i - 1) * 1.5;
            downCard.endY = 0.09;
            downCard.endZ = 0;

            downCard.mesh.rotation.set(Math.PI, 0, 0);
        }

        if (warStage == 2) {
            let card = players[i].cards.shift();

            card.playerIndex = i;
            card.faceDown = false;

            playedCards.push(card);
            comparisonCards.push(card);
            cardsToMove.push(card);

            card.startX = card.mesh.position.x;
            card.startY = card.mesh.position.y;
            card.startZ = card.mesh.position.z;

            card.endX = (i - 1) * 1.5;
            card.endY = 0.13;
            card.endZ = 0;

            card.mesh.rotation.set(Math.PI, 0, 0);
        }
        players[i].updatePile();
    }
    if (checkGameOver()) {
        warRound = false;
    }
    moveAmount = 0;
}

function moveCards() {
    if (fastForward) {
        moveAmount = moveAmount + 0.15;
    }
    else {
        moveAmount = moveAmount + 0.02;
    }

    for (let i = 0; i < cardsToMove.length; i++) {
        let card = cardsToMove[i];

        card.mesh.position.x = card.startX + (card.endX - card.startX) * moveAmount;
        card.mesh.position.y = card.startY + (card.endY - card.startY) * moveAmount + Math.sin(Math.PI * moveAmount) * 0.6;
        card.mesh.position.z = card.startZ + (card.endZ - card.startZ) * moveAmount;

        if (card.faceDown) {
            card.mesh.rotation.x = Math.PI;
        }
        else {
            card.mesh.rotation.x = Math.PI * (1 - moveAmount);
        }
    }

    if (moveAmount >= 1) {
        movingCards = false;
        
        if (warStage != 1) {
            findWinner();
        }

        roundWaiting = true;
    }
}

function collectAnimation() {
    if (fastForward) {
        moveAmount = moveAmount + 0.15;
    }
    else {
        moveAmount = moveAmount + 0.02;
    }

    for (let i = 0; i < playedCards.length; i++) {
        let card = playedCards[i];

        card.mesh.position.x = card.startX + (card.endX - card.startX) * moveAmount;
        card.mesh.position.y = card.startY + (card.endY - card.startY) * moveAmount + Math.sin(Math.PI * moveAmount) * 0.6;
        card.mesh.position.z = card.startZ + (card.endZ - card.startZ) * moveAmount;

        card.mesh.rotation.x = Math.PI * Math.min(moveAmount, 1);
    }

    if (moveAmount >= 1) {
        for (let i = 0; i < playedCards.length; i++) {
            playedCards[i].mesh.rotation.set(0, 0, Math.PI);
            playedCards[i].mesh.scale.set(1, 1, 1);
            players[winner].cards.push(playedCards[i]);
        }

        players[winner].updatePile();

        playedCards = [];
        collectingCards = false;
        warStage = 0;
        checkGameOver();
    }
}

function findWinner() {
    winner = 0;

    if (comparisonCards.length == 0) {
        return;
    }

    for (let i = 1; i < comparisonCards.length; i++) {
        if (comparisonCards[i].value > comparisonCards[winner].value) {
            winner = i
        }
    }

    let highestValue = comparisonCards[winner].value;
    let tie = false;

    for (let i = 0; i < comparisonCards.length; i++) {
        if (i != winner && comparisonCards[i].value == highestValue) {
            tie = true;
        }
    }

    if (tie) {
        warRound = true;
        console.log("war is happening");
    }
    else {
        winner = comparisonCards[winner].playerIndex;
        
        if (warStage > 0) {
            console.log(players[winner].name + " wins war with a " + highestValue);
        }
        else {
            console.log(players[winner].name + " wins the round with a " + highestValue);
        }
        warRound = false;
    }
}

function checkGameOver() {
    let playersLeft = 0;
    let lastPlayer = 0;

    for (let i = 0; i < players.length; i++) {
        if (players[i].cards.length == 0 && !players[i].eliminated) {
            players[i].eliminated = true;
            console.log(players[i].name + " has been eliminated");
        }

        if (!players[i].eliminated) {
            playersLeft++;
            lastPlayer = i;
        }
    }

    if (playersLeft <= 1) {
        gameOver = true;

        if (playersLeft == 1) {
            console.log(players[lastPlayer].name + " wins the game");
        }
        else {
            console.log("The game ended with no players left");
        }
        return true;
    }
    return false;
}

function playRound() {

    if (movingCards || collectingCards || roundWaiting || gameOver) {
        return;
    }

    if (checkGameOver()) {
        return;
    }

    drawCards();
}

// Initializes the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Function that resizes the renderer and camera when the window changes size
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix(); // Applies the new aspect ratio to the camera
    renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", onWindowResize);

window.addEventListener("keydown", function(event) {
    if (event.key.toLowerCase() === "n") {
        playRound();
    }

    if (event.key.toLowerCase() === "f") {
        fastForward = !fastForward;
        console.log("fast forwarding");
    }
});

// Function that runs once per frame to update and draw the scene
function animate() {
    requestAnimationFrame(animate); // Schedules the next frame
    if (movingCards) {
        moveCards();
    }

    if (collectingCards) {
        collectAnimation();
    }

    if (fastForward && !movingCards && !collectingCards && !roundWaiting && !gameOver) {
        playRound();
    }

    if (roundWaiting) {
        if (fastForward) {
            winnerTimer = clock.getElapsedTime() - 1;
        }
        
        if (winnerTimer == 0) {
            winnerTimer = clock.getElapsedTime();
        }

        if (!warRound && winnerScale < 1.25) {
            winnerScale = winnerScale + 0.01;

            let winningCard;

            for (let i = 0; i < comparisonCards.length; i++) {
                if (comparisonCards[i].playerIndex == winner) {
                    winningCard = comparisonCards[i];
                }
            }

            if (winningCard != undefined) {
                winningCard.mesh.scale.set(winnerScale, winnerScale, winnerScale);
            }
        }

        if (clock.getElapsedTime() - winnerTimer >= 1) {
            roundWaiting = false;
            winnerTimer = 0;
            
            if (warRound) {
                if (warStage == 0 || warStage == 2) {
                    warStage = 1;
                    drawWarCards();
                }
                else {
                    warStage = 2;
                    drawWarCards();
                }
            }
            else {
                collectingCards = true;
                moveAmount = 0;

                for (let i = 0; i < playedCards.length; i++) {
                    let card = playedCards[i];

                    card.startX = card.mesh.position.x;
                    card.startY = card.mesh.position.y;
                    card.startZ = card.mesh.position.z;

                    card.endX = players[winner].pilePosition.x;
                    card.endY = Card.thickness / 2;
                    card.endZ = players[winner].pilePosition.z;
                }
            }
        }
    }
    renderer.render(scene, camera);
}

animate();
    </script>
</body>
