// Initializes the Scene
const scene = new THREE.Scene();

]);

// Configures the Camera (Perspective Projection)

const camera = new THREE.PerspectiveCamera(
  50, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 7, 12); // Raises and pulls back the camera to look down at the table
camera.lookAt(new THREE.Vector3(0, 0, -3)); // Aims the camera slightly past the center of the table
scene.add(camera);

// Object that tracks which movement keys are currently pressed
const movementKeys = {
    w: false,
    a: false,
    s: false,
    d: false,
};

const pointLightMoveSpeed = 5; // Speed at which the point light moves in units per second

const pointLightMinX = -6;
const pointLightMaxX = 6;
const pointLightMinZ = -6;
const pointLightMaxZ = 6;

// Loader that turns image files into textures
const textureLoader = new THREE.TextureLoader();

// Class that represents a single playing card with its value, suit, and 3D model
class Card {
    // IMPORTANT: Card dimensions
    static width = 1;
    static height = 1.45;
    static thickness = 0.02;

    // Texture shared by the back of every card
    static backTexture = textureLoader.load("assets/cards/back.png");

    constructor(value, suit) {
        this.value = value; // 2-14, where 11 = jack, 12 = queen, 13 = king, and 14 = ace
        this.suit = suit; // "clubs", "diamonds", "hearts", or "spades"
        this.frontTexture = textureLoader.load("assets/cards/" + this.getFileName());
        this.mesh = this.createMesh();
    }

    // Function that builds the image file name from the card's value and suit
    getFileName() {
        const faceNames = {
            11: "jack",
            12: "queen",
            13: "king",
            14: "ace"
        };
        const valueName = faceNames[this.value] || this.value; // Uses the plain number for 2-10
        return valueName + "_of_" + this.suit + ".png";
    }

    // Function that builds the thin box mesh with the front and back textures
    createMesh() {
        const geometry = new THREE.BoxGeometry(Card.width, Card.thickness, Card.height);
        const edgeShade = 0.6 + Math.random() * 0.4; // Random light grey so each card's edge stands out from its neighbors in the stack
        const edgeMaterial = new THREE.MeshStandardMaterial({
            color: new THREE.Color(edgeShade, edgeShade, edgeShade),
            emissive: 0x000000
        });

        // Array of materials for each side of the box, in the order +x, -x, +y, -y, +z, -z
        const materials = [
            edgeMaterial,
            edgeMaterial,
            new THREE.MeshStandardMaterial({
                map: this.frontTexture // Top side shows the front
            }),
            new THREE.MeshStandardMaterial({
                map: Card.backTexture // Bottom side shows the back
            }),
            edgeMaterial,
            edgeMaterial
        ];

        const mesh = new THREE.Mesh(geometry, materials);
        mesh.castShadow = true; // Allows the card to cast shadows on the table

        return mesh;
    }
}

// Class that builds, shuffles, and deals a standard 52 card deck
class Deck {
    // Array of the 4 suit names, matching the image file names
    static suits = ["clubs", "diamonds", "hearts", "spades"];

    constructor() {
        this.cards = []; // Array that stores every card in the deck

        // Iterates over every suit and every value from 2 to 14 to build all 52 cards
        for (const suit of Deck.suits) {
            for (let value = 2; value <= 14; value++) {
                this.cards.push(new Card(value, suit));
            }
        }
    }

    // Function that shuffles the cards into a random order using the Fisher-Yates algorithm
    shuffle() {
        // Iterates backwards through the deck, swapping each card with a random card at or before it
        for (let i = this.cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1)); // Random index from 0 to i
            const temp = this.cards[i];
            this.cards[i] = this.cards[j];
            this.cards[j] = temp;
        }
    }

    // Function that deals the cards evenly to each player and returns an array of hands
    deal(numPlayers) {
        const cardsPerPlayer = Math.floor(this.cards.length / numPlayers); // 17 each for 3 players, leaving 1 card out
        const hands = []; // Array that stores each player's array of cards

        // Creates an empty hand for each player
        for (let p = 0; p < numPlayers; p++) {
            hands.push([]);
        }

        // Deals one card at a time around the table, like a real dealer
        for (let i = 0; i < cardsPerPlayer * numPlayers; i++) {
            hands[i % numPlayers].push(this.cards[i]);
        }

        return hands;
    }
}

// Class that represents a player and their face-down draw pile
class Player {
    constructor(name, cards, pilePosition) {
        this.name = name;
        this.cards = cards; // Array of the player's cards, where index 0 is the top of the pile
        this.pilePosition = pilePosition; // Spot on the table where the pile sits
        this.eliminated = false; // Attribute to see if a player is eliminated from the game

        // Adds every card in the player's hand to the scene
        for (const card of this.cards) {
            scene.add(card.mesh);
        }

        this.updatePile();
    }

    // Function that stacks the player's cards face down at their pile position
    updatePile() {
        // Iterates over every card, placing the top card (index 0) highest in the stack
        for (let i = 0; i < this.cards.length; i++) {
            const mesh = this.cards[i].mesh;
            const stackIndex = this.cards.length - 1 - i; // 0 for the bottom card, counting up to the top card
            mesh.position.set(
                this.pilePosition.x,
                stackIndex * Card.thickness + Card.thickness / 2, // Rests each card on the one below it
                this.pilePosition.z
            );
            mesh.rotation.set(0, 0, Math.PI); // Flips the card face down
        }
    }
}

// IMPORTANT: Width and depth of the square table top
const tableSize = 12;

// Texture for the wooden table top
const tableTexture = textureLoader.load("assets/table.jpg");

// Table top that all of the cards rest on
const table = new THREE.Mesh(
    new THREE.PlaneGeometry(tableSize, tableSize),
    new THREE.MeshStandardMaterial({map: tableTexture})
);
table.rotation.x = -Math.PI / 2; // Rotates the plane from standing upright to lying flat, facing up
scene.add(table);
table.receiveShadow = true; // Allows the table to receive shadows from the cards

// Lighting that illuminates the scene
const ambientLight = new THREE.AmbientLight(0x5f7898, 1.15); // Cool ambient light keeps the shaded slopes visible.
scene.add(ambientLight);

// Point-light sphere + geometry
const sphereGeometry = new THREE.SphereGeometry(0.1, 32, 32);
const sphereMaterial = new THREE.MeshBasicMaterial({color: 0x00ff00});
const cylinderGeometry = new THREE.CylinderGeometry(0.08, 0.08, 5, 16);
const cylinderMaterial = new THREE.MeshBasicMaterial({color: 0xaaaaaa});
const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
sphere.position.set(0, 5, 4);
cylinder.position.set(0, 7.5, 4);

const pointLight = new THREE.PointLight(0x00ff00, 0.5, 10); // Point light that shines from above the table
pointLight.position.x = sphere.position.x;
pointLight.position.y = sphere.position.y;
pointLight.position.z = sphere.position.z;

let hangingLight = new THREE.Group();
hangingLight.add(sphere);
hangingLight.add(cylinder);
hangingLight.add(pointLight);
scene.add(hangingLight);

// Directional light that shines from behind the camera
const directionalLight = new THREE.DirectionalLight(0xfff2d9, 0.8); // Warm white light
directionalLight.position.set(3, 8, 12); // Matches the low sun behind the camera in the skybox photos
directionalLight.castShadow = true; // Enables shadows for this light
// Shadow map resolution is increased to make the shadows sharper and more detailed
directionalLight.shadow.mapSize.width = 2048;
directionalLight.shadow.mapSize.height = 2048;

// Configures the shadow camera to cover the area of the table and cards
directionalLight.shadow.camera.left = -8;
directionalLight.shadow.camera.right = 8;
directionalLight.shadow.camera.top = 8;
directionalLight.shadow.camera.bottom = -8;
directionalLight.shadow.camera.updateProjectionMatrix(); // Applies the new shadow camera settings
directionalLight.shadow.bias = -0.0001; // Reduces shadow acne artifacts
directionalLight.target.position.set(0, 0, 0);

scene.add(directionalLight);
scene.add(directionalLight.target);

// Deck that is shuffled and dealt to 3 players
const deck = new Deck();
deck.shuffle();
const hands = deck.deal(3);

// IMPORTANT: Spots on the table for each player's pile
const pilePositions = [
    new THREE.Vector3(-4, 0, 3), // Player 1, front left
    new THREE.Vector3(0, 0, -4), // Player 2, back center
    new THREE.Vector3(4, 0, 3) // Player 3, front right
];

// Array that stores the 3 players
const players = [];

// Iterates over each hand, creating a player with their own pile position
for (let i = 0; i < hands.length; i++) {
    players.push(new Player("Player " + (i + 1), hands[i], pilePositions[i]));
}

// arrays of all total cards, cards to compare (for game), and cards to animate (comparison + war cards)
let playedCards = [];
let comparisonCards = [];
let cardsToMove = [];

// attributes for animations
let roundWaiting = false;
let movingCards = false;
let collectingCards = false;
let moveAmount = 0;
const cardMoveSpeed = 0.2;
const fastForwardSpeed = 5; 


//attributes for winning card + winning players
let winner = 0;
let gameOver = false;
let winnerScale = 1;
let winnerTimer = 0;
const clock = new THREE.Clock();

//attributes for war
let warRound = false;
let warStage = 0;

// fast forward attribute
let fastForward = false;

// takes one card from each surviving player and moves it to their respective middle position
function drawCards() {
    playedCards = [];
    comparisonCards = [];
    cardsToMove = [];

    movingCards = true;
    winnerScale = 1;
    warRound = false;

    // goes through each player and draws their top card
    for (let i = 0; i < players.length; i++) {
        // check if they are eliminated before drawing
        if (players[i].eliminated) {
            continue;
        }

        // removes the top card from their pile
        let card = players[i].cards.shift();

        // if they have no card, eliminate them
        if (card == undefined) {
            players[i].eliminated = true;
            continue;
        }

        // remember whos card is which player
        card.playerIndex = i;
        card.faceDown = false;
        
        // stores the cards for playing, comparisons and animations
        playedCards.push(card);
        comparisonCards.push(card);
        cardsToMove.push(card);

        // starting positions for animations
        card.startX = card.mesh.position.x;
        card.startY = card.mesh.position.y;
        card.startZ = card.mesh.position.z;

        // end positions for animations (middle of table)
        card.endX = (i - 1) * 1.5;
        card.endY = 0.05;
        card.endZ = 0;
        
        // rotates it face up for animation
        card.mesh.rotation.set(Math.PI, 0, 0);

        // updates the pile
        players[i].updatePile();
    }
    moveAmount = 0; // reset any previous round animation movement
}

// handles war card drawing when war happens (2+ cards draw)
function drawWarCards() {
    comparisonCards = [];
    cardsToMove = [];
    movingCards = true;

    // check if any players are eliminated
    for (let i = 0; i < players.length; i++) {
        if (players[i].eliminated) {
            continue;
        }
        
        // check if they can even play war. you need 2 cards for war, so if you only have 1 then you are eliminated
        if (warStage == 1 && players[i].cards.length < 2) {
            players[i].eliminated = true;
            console.log(players[i].name + " has been eliminated from war");

            // move cards to middle as war (on top of previous cards)
            while (players[i].cards.length > 0) {
                let card = players[i].cards.shift();

                card.playerIndex = i;
                card.faceDown = true;
                
                playedCards.push(card);
                cardsToMove.push(card);

                // save positions and destinations for animations
                card.startX = card.mesh.position.x;
                card.startY = card.mesh.position.y;
                card.startZ = card.mesh.position.z;

                card.endX = (i - 1) * 1.5;
                card.endY = 0.09;
                card.endZ = 0;
                
                card.mesh.rotation.set(Math.PI, 0, 0);
            }

            players[i].updatePile();
            continue;
        }

        // stage 1: all survivors put a FACE DOWN card ontop of the original face up cards
        if (warStage == 1) {
            let downCard = players[i].cards.shift();
            
            downCard.playerIndex = i;
            downCard.faceDown = true;

            // cards are NOT added to comparison cards, as they are "trash" cards that are not to be used
            playedCards.push(downCard);
            cardsToMove.push(downCard);

            // save positions and destinations for animation
            downCard.startX = downCard.mesh.position.x;
            downCard.startY = downCard.mesh.position.y;
            downCard.startZ = downCard.mesh.position.z;

            downCard.endX = (i - 1) * 1.5;
            downCard.endY = 0.09;
            downCard.endZ = 0;

            downCard.mesh.rotation.set(Math.PI, 0, 0);
        }

        // stage 2: after placing a face down card, all players place a face up card
        if (warStage == 2) {
            let card = players[i].cards.shift();

            card.playerIndex = i;
            card.faceDown = false;

            // add cards to arrays (especially comparison because it is not a "trash" card)
            playedCards.push(card);
            comparisonCards.push(card);
            cardsToMove.push(card);

            // save positions and destinations for animation
            card.startX = card.mesh.position.x;
            card.startY = card.mesh.position.y;
            card.startZ = card.mesh.position.z;

            card.endX = (i - 1) * 1.5;
            card.endY = 0.13;
            card.endZ = 0;

            card.mesh.rotation.set(Math.PI, 0, 0);
        }
        players[i].updatePile();
    }
    moveAmount = 0;
}

// helper method to animate cards from piles to the middle of table (animation #1)
function moveCards(deltaTime) {
    
    let speed = 1 / cardMoveSpeed;

    // if fast forward, just make the cards move faster
    if (fastForward) {
        speed = speed * fastForwardSpeed;
    }
    
    moveAmount = Math.min(moveAmount + speed * deltaTime, 1);

    // updates the position and rotation of every moving card
    for (let i = 0; i < cardsToMove.length; i++) {
        let card = cardsToMove[i];

        card.mesh.position.x = card.startX + (card.endX - card.startX) * moveAmount;
        card.mesh.position.y = card.startY + (card.endY - card.startY) * moveAmount + Math.sin(Math.PI * moveAmount) * 0.6;
        card.mesh.position.z = card.startZ + (card.endZ - card.startZ) * moveAmount;

        // keep face down cards as face down. otherwise, slowly rotate the card so it can be face up.
        if (card.faceDown) {
            card.mesh.rotation.x = Math.PI;
        }
        else {
            card.mesh.rotation.x = Math.PI * (1 - moveAmount);
        }
    }

    // once animation finishes, stop moving the cards
    if (moveAmount >= 1) {
        movingCards = false;
        
        // do not compare cards that are face down.
        if (warStage != 1) {
            findWinner();
        }

        // small intermission after animation (to look at cards)
        roundWaiting = true;
    }
}

// animation #2: winner collects all cards in the middle
function collectAnimation(deltaTime) {
    let speed = 1 / cardMoveSpeed;
    
    // fast forward speeds up the animation. movement is the movement speed
    if (fastForward) {
        speed = speed * fastForwardSpeed;
    }

    moveAmount = Math.min(moveAmount + speed * deltaTime, 1);

    // moves each played card towards the winner pile
    for (let i = 0; i < playedCards.length; i++) {
        let card = playedCards[i];

        card.mesh.position.x = card.startX + (card.endX - card.startX) * moveAmount;
        card.mesh.position.y = card.startY + (card.endY - card.startY) * moveAmount + Math.sin(Math.PI * moveAmount) * 0.6;
        card.mesh.position.z = card.startZ + (card.endZ - card.startZ) * moveAmount;

        card.mesh.rotation.x = Math.PI * Math.min(moveAmount, 1);
    }

    // once all cards are at the pile, update attributes and arrays
    if (moveAmount >= 1) {
        // reset card appearances and give it to the winner
        for (let i = 0; i < playedCards.length; i++) {
            playedCards[i].mesh.rotation.set(0, 0, Math.PI);
            playedCards[i].mesh.scale.set(1, 1, 1);
            players[winner].cards.push(playedCards[i]);
        }

        // add the cards to the winner pile visually
        players[winner].updatePile();
        playedCards = [];
        
        collectingCards = false;
        warStage = 0;
        
        // check if there is anyone eliminated after collecting cards
        checkGameOver();
    }
}

// compares face up cards and finds either the winner, or detects if there is a tie
function findWinner() {
    winner = 0;

    // no face up cards = no comparison
    if (comparisonCards.length == 0) {
        return;
    }

    // finds the position of the highest value card in compareCards array
    for (let i = 1; i < comparisonCards.length; i++) {
        if (comparisonCards[i].value > comparisonCards[winner].value) {
            winner = i
        }
    }

    let highestValue = comparisonCards[winner].value;
    let tie = false;

    // checks if there are any ties 
    for (let i = 0; i < comparisonCards.length; i++) {
        if (i != winner && comparisonCards[i].value == highestValue) {
            tie = true;
        }
    }

    // if there is a tie, start a war
    if (tie) {
        warRound = true;
        console.log("war is happening");
    }
    // mark the player as the winner for that round, and display that they won the round.
    else {
        winner = comparisonCards[winner].playerIndex;
        
        if (warStage > 0) {
            console.log(players[winner].name + " wins war with a " + highestValue);
        }
        else {
            console.log(players[winner].name + " wins the round with a " + highestValue);
        }
        warRound = false; // safety to make sure war does not start when there is not a tie.
    }
}

// marks players as eliminated if they have no cards, and checks if the game has fully ended
function checkGameOver() {
    let playersLeft = 0;
    let lastPlayer = 0;

    // a player with an empty pile is marked as eliminated if they are already not eliminated
    for (let i = 0; i < players.length; i++) {
        if (players[i].cards.length == 0 && !players[i].eliminated) {
            players[i].eliminated = true;
            console.log(players[i].name + " has been eliminated");
        }

        // count the players who are left in the game
        if (!players[i].eliminated) {
            playersLeft++;
            lastPlayer = i;
        }
    }

    // game ends when there is at most one active player (or zero, if you end up in war 17/2 times)
    if (playersLeft <= 1) {
        gameOver = true;

        if (playersLeft == 1) {
            console.log(players[lastPlayer].name + " wins the game");
        }
        else {
            console.log("The game ended with no players left");
        }
        return true;
    }
    return false;
}

// starts a new round when called
function playRound() {

    // prevent another round from starting while cards are in an animation
    if (movingCards || collectingCards || roundWaiting || gameOver) {
        return;
    }

    // do not play a round if the entire game has ended
    if (checkGameOver()) {
        return;
    }

    // other wise, play the round and draw cards.
    drawCards();
}

// Initializes the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true; // Enables shadows for a more realistic look
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);

// Function that resizes the renderer and camera when the window changes size
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix(); // Applies the new aspect ratio to the camera
    renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", onWindowResize);

window.addEventListener("keydown", function(event) {
    // if n is pressed, play one single full round
    if (event.key.toLowerCase() === "n") {
        playRound();
    }

    // if f is pressed, fast forward
    if (event.key.toLowerCase() === "f") {
        fastForward = !fastForward;
        if (fastForward) {
            console.log("fast forwarding");
        }
        else {
            console.log("slowing down");
        }
    }

    if (event.key.toLowerCase() === "l") {
        ambientLight.visible = !ambientLight.visible;
    }

    if (event.key.toLowerCase() === "p") {
        pointLight.visible = !pointLight.visible;
    }

    if (event.key.toLowerCase() === "w") {
        movementKeys.w = true;
    }

    if (event.key.toLowerCase() === "a") {
        movementKeys.a = true;
    }

    if (event.key.toLowerCase() === "s") {
        movementKeys.s = true;
    }

    if (event.key.toLowerCase() === "d") {
        movementKeys.d = true;
    }

    if (event.key.toLowerCase() === "o") {
        directionalLight.visible = !directionalLight.visible;
    }

    if (event.key.toLowerCase() === "m") {
        directionalLight.castShadow = !directionalLight.castShadow;
    }
});

window.addEventListener("keyup", function(event) {
    if (event.key.toLowerCase() === "w") {
        movementKeys.w = false;
    }

    if (event.key.toLowerCase() === "a") {
        movementKeys.a = false;
    }

    if (event.key.toLowerCase() === "s") {
        movementKeys.s = false;
    }

    if (event.key.toLowerCase() === "d") {
        movementKeys.d = false;
    }
});

// Function that runs once per frame to update and draw the scene
function animate() {
    requestAnimationFrame(animate); // Schedules the next frame

    const deltaTime = clock.getDelta(); // Time elapsed since the last frame in seconds

    if (movementKeys.w) {
        hangingLight.position.z -= pointLightMoveSpeed * deltaTime
    }

    if (movementKeys.s) {
        hangingLight.position.z += pointLightMoveSpeed * deltaTime
    }

    if (movementKeys.a) {
        hangingLight.position.x -= pointLightMoveSpeed * deltaTime
    }

    if (movementKeys.d) {
        hangingLight.position.x += pointLightMoveSpeed * deltaTime
    }

    pointLight.position.x = THREE.MathUtils.clamp(pointLight.position.x, pointLightMinX, pointLightMaxX);
    pointLight.position.z = THREE.MathUtils.clamp(pointLight.position.z, pointLightMinZ, pointLightMaxZ);

    // constantly call movingCards to animate moving the cards
    if (movingCards) {
        moveCards(deltaTime);
    }

    // constantly call collectingCards to animate winner collecting the cards
    if (collectingCards) {
        collectAnimation(deltaTime);
    }

    // constantly play rounds if in fast forward mode
    if (fastForward && !movingCards && !collectingCards && !roundWaiting && !gameOver) {
        playRound();
    }

    // intermission period (between drawing and collecting, to actually see the cards)
    if (roundWaiting) {
        if (fastForward) {
            winnerTimer = clock.getElapsedTime() - 1;
        }
        
        // records start time of intermission period
        if (winnerTimer == 0) {
            winnerTimer = clock.getElapsedTime();
        }

        // slightly largens the winning card to make it obvious who won
        if (!warRound && winnerScale < 1.25) {
            winnerScale = winnerScale + 0.01;

            let winningCard;

            // find the card that won
            for (let i = 0; i < comparisonCards.length; i++) {
                if (comparisonCards[i].playerIndex == winner) {
                    winningCard = comparisonCards[i];
                }
            }

            // apply size scale to winning card
            if (winningCard != undefined) {
                winningCard.mesh.scale.set(winnerScale, winnerScale, winnerScale);
            }
        }

        // continue when intermission period finishes. winnerTimer controls intermission period
        if (clock.getElapsedTime() - winnerTimer >= 1) {
            roundWaiting = false;
            winnerTimer = 0;
            
            // start war and war animations during war
            if (warRound) {
                if (warStage == 0 || warStage == 2) {
                    warStage = 1;
                    drawWarCards();
                }
                else {
                    warStage = 2;
                    drawWarCards();
                }
            }
            
            // if theres not war, animate winner collecting cards
            else {
                collectingCards = true;
                moveAmount = 0;

                for (let i = 0; i < playedCards.length; i++) {
                    let card = playedCards[i];

                    // save positions and destinations for animations
                    card.startX = card.mesh.position.x;
                    card.startY = card.mesh.position.y;
                    card.startZ = card.mesh.position.z;

                    card.endX = players[winner].pilePosition.x;
                    card.endY = Card.thickness / 2;
                    card.endZ = players[winner].pilePosition.z;
                }
            }
        }
    }
    renderer.render(scene, camera);
}

animate();
    </script>
